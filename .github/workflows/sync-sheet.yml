name: Sync Google Sheet

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Sync sheet data
        run: pnpm dlx tsx scripts/sync-sheet.ts
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}

      - name: Commit if changed
        run: |
          git diff --quiet src/data.tsv && echo "No changes" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data.tsv
          git commit -m "sync: update dataset from Google Sheet"
          git push
