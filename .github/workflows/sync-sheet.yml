name: Sync Google Sheet

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Sync sheet data
        run: pnpm dlx tsx scripts/sync-sheet.ts
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}

      - name: Commit if changed
        run: |
          git diff --quiet src/data.tsv && echo "No changes" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data.tsv
          git commit -m "sync: update dataset from Google Sheet"
          git push
