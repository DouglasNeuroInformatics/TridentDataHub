name: Sync Google Sheet

on:
  schedule:
    # Every day at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: "sync-sheet"
  cancel-in-progress: false

env:
  SYNC_BRANCH: sync/google-sheet

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Sync sheet data
        run: pnpm dlx tsx scripts/sync-sheet.ts
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}
          SHEET_GID: ${{ vars.SHEET_GID }}

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet src/data.tsv; then
            echo "No changes to src/data.tsv"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo 'stat<<DIFFSTAT'
              git diff --stat src/data.tsv
              echo DIFFSTAT
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Push sync branch
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH"
          git add src/data.tsv
          git commit -m "sync: update dataset from Google Sheet"
          git push --force origin "$SYNC_BRANCH"

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DIFFSTAT: ${{ steps.diff.outputs.stat }}
        run: |
          body=$(printf '%s\n' \
            'Automated sync of `src/data.tsv` from the Google Sheet. Researcher emails are scrubbed by `scripts/sync-sheet.ts` before commit.' \
            '' \
            '```' \
            "$DIFFSTAT" \
            '```' \
            '' \
            'Review the diff, then merge. Merging to `main` redeploys the site.')

          existing=$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body "$body"
            echo "Updated existing PR #$existing"
          else
            gh pr create \
              --base main \
              --head "$SYNC_BRANCH" \
              --title "sync: update dataset from Google Sheet" \
              --body "$body"
          fi
